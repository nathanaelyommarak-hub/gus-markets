# ============================================================
#  FinShorts configuration  (all channel-facing text = English)
# ============================================================
channel:
  name: "Gus Markets"             # final (YouTube + Instagram); env CHANNEL_NAME overrides
  handle: "@GusMarkets"
  mascot: "Gus"
  catchphrase: "Already forgot the dip. Next."
  disclaimer: "Not financial advice. For entertainment and education only."
  timezone: "UTC"
  audience_timezone: "Europe/Zurich"   # slot times below are UTC; Zurich = UTC+1 (winter) / UTC+2 (summer)

# ---------------- brand ----------------
brand:
  navy: "#0B1630"
  mint: "#22E39B"      # up / green signal
  coral: "#FF4D5E"     # down / red signal
  orange: "#FF8A3D"    # Gus + numbers
  white: "#FFFFFF"
  font_title: "assets/fonts/Montserrat-ExtraBold.ttf"   # titles + captions (OFL)
  font_body: "assets/fonts/Inter.ttf"                   # body text (OFL)

# ---------------- output ----------------
video:
  renderer: premium         # premium = native 2160x3840 @ 60 fps motion-graphics renderer (finshorts/premium.py) | classic = old 1080p30
  width: 2160
  height: 3840
  fps: 60                   # every frame rendered natively (no frame duplication / interpolation)
  min_seconds: 25
  max_seconds: 40            # target 25-40 s; TTS speed auto-adjusts (0.88-1.2) to fit
  hard_max_seconds: 40.0     # HARD cap for the final file (voice + music tail), checked before and after render
  tail: 0.8                  # music tail after the last word (shrinks to 0.3 s if needed)
  min_speed: 0.88
  max_speed: 1.2
  comfortable_speed: 1.1     # trim optional lines before going faster than this
  est_words_per_sec: 2.3     # pre-TTS length estimate at speed 1.0 -> trims the script before synthesis
  crf: 17                   # H.264 High@5.2, yuv420p, BT.709 tagged; maxrate keeps peaks near YouTube's 4K60 SDR upload guide
  ig_derivative: true       # also write <job>_ig1080.mp4 (1080x1920 30 fps Reels spec) - IG upload itself stays disabled
  preset: "medium"         # measured: 4K60 medium ~19 fps on 4 vCPU (veryfast ~40); ample headroom inside the 30 min budget
  maxrate: "60M"
  bufsize: "120M"
  audio_bitrate: "256k"     # AAC-LC 48 kHz stereo
  workers: 0                # render processes (0 = one per CPU); frames are rendered + encoded in parallel segments

# ---------------- schedule / launch phases ----------------
schedule:
  # Slot i (in the order below) is active when i < per_day of the current phase. Before the first phase -> 0/day.
  # Quality over quantity (owner decision 2026-10-30): fixed at 3 premium 4K60 videos/day = s01-s03
  # (19:00, 22:15, 17:30 Europe/Zurich). Slots s04-s10 stay defined but inactive. The former ramp to 10/day
  # from 2026-11-11 is disabled; re-enable by adding e.g. {from: "YYYY-MM-DD", per_day: 10}.
  phases:
    - {from: "2026-10-28", per_day: 3}
  # GitHub cron runs often start 30-60 min late or are dropped: any run posts the most recent missed active slot
  # up to max_late_min after its time, at most one per run and not within min_gap_min of the last upload.
  catch_up: {max_late_min: 180, min_gap_min: 30}
  # 10 slots, times in UTC (Zurich = UTC+1 in winter, UTC+2 from 2027-03-28 -> everything shifts +1 h local in summer).
  # Order = priority. Min. 45 min between uploads.
  slots:
    - {id: s01, utc: "18:00", format: crypto_update}      # 19:00 Zurich  Crypto Evening
    - {id: s02, utc: "21:15", format: close_recap}        # 22:15 Zurich  after NYSE close (20:00/21:00 UTC)
    - {id: s03, utc: "16:30", format: chart_of_the_day}   # 17:30 Zurich
    - {id: s04, utc: "14:45", format: us_open}            # 15:45 Zurich  after the open in both DST phases
    - {id: s05, utc: "19:30", format: quiz}               # 20:30 Zurich
    - {id: s06, utc: "12:00", format: pre_market}         # 13:00 Zurich
    - {id: s07, utc: "11:00", format: macro_calendar}     # 12:00 Zurich
    - {id: s08, utc: "20:30", format: explainer}          # 21:30 Zurich
    - {id: s09, utc: "13:00", format: midday_movers}      # 14:00 Zurich
    - {id: s10, utc: "07:00", format: crypto_morning}     # 08:00 Zurich
  # stock markets are closed on weekends -> swap or skip stock slots (Sat = 5, Sun = 6 by UTC weekday)
  weekend_overrides:
    sat: {close_recap: week_recap, us_open: myth_buster, pre_market: skip, macro_calendar: skip}
    sun: {close_recap: skip, us_open: myth_buster, pre_market: week_ahead, macro_calendar: skip}

# ---------------- formats ----------------
formats:
  pre_market:
    label: "PRE-MARKET"
    topic: [stocks, macro]
    chart: {kind: index, symbol: "^GSPC", days: 30}
    needs_story: true
    news_topics: [stocks, macro]      # strict story matching
  crypto_update:
    label: "CRYPTO UPDATE"
    topic: [crypto]
    chart: {kind: coin, id: bitcoin, days: 7}
    needs_story: true
    news_topics: [crypto]      # strict story matching
  chart_of_the_day:
    label: "CHART OF THE DAY"
    topic: [stocks, crypto, macro]
    chart: {kind: rotate}         # rotates across BTC / ETH / S&P 500 / Nasdaq / 10Y yield
    needs_story: false
  explainer:
    label: "60-SECOND MBA"
    topic: [macro]
    chart: {kind: fred, series: DGS10, days: 180}
    needs_story: false
    topics_pool: [bond_yields, inflation, rate_cuts, market_cap, etf, halving, dollar_index]
  quiz:
    label: "FISHBOWL QUIZ"
    topic: [crypto, stocks]
    chart: {kind: coin, id: ethereum, days: 30}
    needs_story: false
  crypto_morning:
    label: "MORNING CRYPTO"
    kind: crypto
    topic: [crypto]
    chart: {kind: coin, id: bitcoin, days: 1}
    needs_story: true
    news_topics: [crypto]      # strict story matching
  us_open:
    label: "US OPEN"
    kind: stocks
    topic: [stocks, macro]
    chart: {kind: index, symbol: "^IXIC", days: 30}
    needs_story: true
    news_topics: [stocks, macro]      # strict story matching
  close_recap:
    label: "CLOSING BELL"
    kind: stocks
    topic: [stocks, crypto, macro]
    chart: {kind: index, symbol: "^GSPC", days: 10}
    needs_story: true
    news_topics: [stocks, macro]      # strict story matching
  midday_movers:
    label: "MIDDAY MOVERS"
    kind: movers
    topic: [crypto]
    chart: {kind: movers}
    needs_story: false
  macro_calendar:
    label: "MACRO CALENDAR"
    kind: calendar
    topic: [macro]
    chart: {kind: fred, series: DFF, days: 365}
    needs_story: false
  week_recap:
    label: "WEEK IN REVIEW"
    kind: stocks
    topic: [stocks, crypto, macro]
    chart: {kind: index, symbol: "^GSPC", days: 7}
    needs_story: true
    news_topics: [stocks, macro]      # strict story matching
  recap:
    label: "DAILY RECAP"
    topic: [stocks, crypto, macro]
    chart: {kind: index, symbol: "^GSPC", days: 5}
    needs_story: true
    news_topics: [stocks, macro]      # strict story matching
  macro_watch:
    label: "MACRO WATCH"
    topic: [macro]
    chart: {kind: fred, series: DGS10, days: 90}
    needs_story: true
    news_topics: [macro]      # strict story matching
  top_movers:
    label: "TOP MOVERS"
    topic: [crypto]
    chart: {kind: movers}
    needs_story: false
  myth_buster:
    label: "MYTH BUSTER"
    topic: [crypto, stocks]
    chart: {kind: coin, id: bitcoin, days: 365}
    needs_story: false
  daily_update:                       # ~5 min 4K60 landscape long-form (run_long.py, own workflow daily_long.yml)
    label: "DAILY UPDATE"
    topic: [stocks, crypto, macro]
    chart: {kind: index, symbol: "^GSPC", days: 90}
    needs_story: true
    news_topics: [stocks, macro, crypto]
  weekend_update:                     # Sat + Sun: week in review / week ahead + crypto
    label: "WEEKEND UPDATE"
    topic: [crypto, stocks, macro]
    chart: {kind: coin, id: bitcoin, days: 30}
    needs_story: true
    news_topics: [crypto, stocks, macro]
  week_ahead:
    label: "WEEK AHEAD"
    topic: [macro, stocks]
    chart: {kind: index, symbol: "^GSPC", days: 90}
    needs_story: true
    news_topics: [stocks, macro]      # strict story matching

# ---------------- market data ----------------
data:
  coingecko:
    base_url: "https://api.coingecko.com/api/v3"   # Demo plan root (key via env COINGECKO_API_KEY)
    coins: [bitcoin, ethereum, solana, ripple, dogecoin]
  stocks:
    # provider order; first that works wins.
    #  alphavantage = official free key (25 req/day) -> commercial-friendlier
    #  fred         = S&P 500 / Nasdaq daily closes, keyless CSV or API key
    #  yahoo        = unofficial endpoint, personal use only per Yahoo ToS -> dev/dry-run only
    providers: [alphavantage, fred, yahoo]
    indices:
      "^GSPC": {name: "S&P 500", fred: SP500, av: SPY}
      "^IXIC": {name: "Nasdaq", fred: NASDAQCOM, av: QQQ}
  fred_series:
    DGS10: "10-year Treasury yield"
    DFF: "Fed funds rate"
    DTWEXBGS: "US dollar index (broad)"
  cache_minutes: 50

# ---------------- news / fact check ----------------
news:
  max_age_hours: 18
  min_independent_sources: 2
  similarity_threshold: 0.28
  feeds:
    # owner = corporate group; sources with the same owner do NOT count as independent
    - {name: CoinDesk,        owner: coindesk,     topic: crypto, url: "https://www.coindesk.com/arc/outboundfeeds/rss/"}
    - {name: Cointelegraph,   owner: cointelegraph, topic: crypto, url: "https://cointelegraph.com/rss"}
    - {name: Decrypt,         owner: decrypt,      topic: crypto, url: "https://decrypt.co/feed"}
    - {name: Bitcoin Magazine, owner: btcinc,      topic: crypto, url: "https://bitcoinmagazine.com/.rss/full/"}
    - {name: CryptoSlate,     owner: cryptoslate,  topic: crypto, url: "https://cryptoslate.com/feed/"}
    - {name: The Block,       owner: theblock,     topic: crypto, url: "https://www.theblock.co/rss.xml"}
    - {name: CNBC Markets,    owner: nbcuniversal, topic: stocks, url: "https://search.cnbc.com/rs/search/combinedcms/view.xml?partnerId=wrss01&id=20910258"}
    - {name: CNBC Economy,    owner: nbcuniversal, topic: macro,  url: "https://search.cnbc.com/rs/search/combinedcms/view.xml?partnerId=wrss01&id=20910258"}
    - {name: MarketWatch,     owner: dowjones,     topic: stocks, url: "https://feeds.content.dowjones.io/public/rss/mw_topstories"}
    - {name: Yahoo Finance,   owner: yahoo,        topic: stocks, url: "https://finance.yahoo.com/news/rssindex"}
    - {name: Investing.com,   owner: investing,    topic: stocks, url: "https://www.investing.com/rss/news_25.rss"}
    - {name: Federal Reserve, owner: fed,          topic: macro,  url: "https://www.federalreserve.gov/feeds/press_all.xml"}
    - {name: Seeking Alpha,   owner: seekingalpha, topic: stocks, url: "https://seekingalpha.com/market_currents.xml"}
    - {name: Fortune,         owner: fortune,      topic: stocks, url: "https://fortune.com/feed/fortune-feeds/?id=3230629"}
    - {name: BBC Business,    owner: bbc,          topic: macro,  url: "https://feeds.bbci.co.uk/news/business/rss.xml"}
    - {name: Guardian Business, owner: guardian,   topic: macro,  url: "https://www.theguardian.com/uk/business/rss"}

# ---------------- LLM ----------------
llm:
  # tried in order; on any error / validation failure -> next; last resort = template
  providers: [gemini, groq, ollama, template]   # providers without an API key are skipped (no GROQ key -> straight to Gemini)
  groq:   {model: "openai/gpt-oss-120b", base_url: "https://api.groq.com/openai/v1"}
  gemini: {model: "gemini-flash-lite-latest"}
  ollama: {model: "qwen2.5:3b", base_url: "http://localhost:11434"}
  temperature: 0.8
  max_retries: 2

# ---------------- TTS ----------------
tts:
  engine: kokoro
  kokoro:
    repo_id: "hexgrad/Kokoro-82M"
    lang_code: "a"            # American English
    voice: "am_michael"       # deep, calm male newsreader
    speed: 1.0
  piper:                      # fallback engine
    model: "en_US-john-medium"
    length_scale: 1.0
  subtitles: engine           # engine (Kokoro timestamps) | whisper (faster-whisper)

# ---------------- music ----------------
music:
  source: generated           # generated = synthesized at runtime (no third-party rights) | file
  file: ""                    # CC0 file path if source=file
  volume_db: -23

# ---------------- community (all off by default; see finshorts/community.py) ----------------
community:
  telegram_poll: false          # post the video's poll question as a native Telegram poll (sendPoll)
  telegram_poll_slot: s01       # ONE poll per day (19:00 Zurich video), not one per upload
  youtube_comment: false        # post the poll/pinned text as a comment (50 quota units; needs youtube.force-ssl); pin manually
  instagram_comment: false      # POST /{media-id}/comments (instagram_manage_comments); pin manually in the app
  poll_open_hours: 24

# ---------------- approval & upload ----------------
approval:
  telegram: false             # set true + TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID
  timeout_minutes: 25
  on_timeout: skip            # skip | approve

upload:
  youtube:
    enabled: true
    privacy: public           # public | unlisted | private
    category_id: "25"         # News & Politics
    contains_synthetic_media: true   # AI voice/altered content disclosure (status.containsSyntheticMedia)
    notify_subscribers: false
  instagram:
    enabled: false          # on once IG account + token exist
    mode: resumable           # resumable (graph.facebook.com, no hosting needed) | url (needs public URL)
    graph_version: "v26.0"
    share_to_feed: true
    max_hashtags: 4             # 3-4 focused hashtags (YT + IG)
  hosting:                    # only for instagram.mode = url
    provider: github_release  # github_release | r2
    delete_after_publish: true

motion:                      # motion-graphics scene layer (own designs; no publisher/coin/company logos)
  enabled: true
  sfx: true                  # self-synthesised whoosh / pop / tick
  sfx_db: -9
  people: true               # portraits only from Wikimedia Commons with PD / CC0 / CC BY / CC BY-SA
  cutout: true               # rembg (MIT, u2netp) background removal - not applied to CC BY-SA images

long:                        # daily long-form landscape video (run_long.py / .github/workflows/daily_long.yml)
  slot_utc: "21:45"          # 22:45 Zurich winter / 23:45 summer; 30 min after the s02 Short
  catch_up_max_late_min: 240 # GitHub cron is often late or dropped -> catch-up crons until 01:45 UTC
  target_seconds: [270, 330] # 4:30 - 5:30; TTS speed adapts within 0.92 - 1.12
  tail: 4.0                  # outro music tail after the last word
  tts_speed: 1.0
  gaps: {sting: 3.2, card: 1.6, why: 0.5, story: 1.0}
  stories_max: 4             # up to 3 stocks/macro + 1 crypto (weekend: 2 + 2), each verified by 2+ independent owners
  story_dedupe_hours: 72
  llm_models: [gemini-flash-latest, gemini-flash-lite-latest]
  llm_retries: 4
  music_db: -24              # self-synthesised bed under the voice (sidechain ducked); final mix loudnorm -14 LUFS
  sfx_db: -12
  video:
    fps: 60
    crf: 18
    preset: veryfast
    maxrate: "50M"
    bufsize: "100M"
    gb_per_worker: 2.2
    audio_bitrate: "320k"
    workers: 0
  upload:
    enabled: true
    privacy: public
    category_id: "25"          # News & Politics
    contains_synthetic_media: true
    notify_subscribers: true
    captions: true             # captions.insert (needs youtube.force-ssl scope; skipped gracefully without it)
