name: finshorts
# One cron per slot (UTC). GitHub may start scheduled jobs 5-30 min late; run.py --auto accepts a 40-min window
# and only runs as many slots as the ramp allows (3/day -> 10/day over 14 days, see config/config.yaml).
on:
  schedule:
    - cron: "0 18 * * *"      # s01 crypto_update  (19:00 Berlin winter)
    - cron: "15 21 * * *"     # s02 close_recap  (22:15 Berlin winter)
    - cron: "30 16 * * *"     # s03 chart_of_the_day  (17:30 Berlin winter)
    - cron: "45 14 * * *"     # s04 us_open  (15:45 Berlin winter)
    - cron: "30 19 * * *"     # s05 quiz  (20:30 Berlin winter)
    - cron: "0 12 * * *"      # s06 pre_market  (13:00 Berlin winter)
    - cron: "0 11 * * *"      # s07 macro_calendar  (12:00 Berlin winter)
    - cron: "30 20 * * *"     # s08 explainer  (21:30 Berlin winter)
    - cron: "0 13 * * *"      # s09 midday_movers  (14:00 Berlin winter)
    - cron: "0 7 * * *"       # s10 crypto_morning  (08:00 Berlin winter)
  workflow_dispatch:
    inputs:
      format: {description: "format (empty = --auto)", required: false, default: ""}
      dry_run: {description: "dry run (no upload)", type: boolean, default: true}

permissions:
  contents: write          # commit state/upload_log.json + GitHub Release hosting (Instagram url mode)

concurrency: {group: finshorts, cancel-in-progress: false}

jobs:
  make:
    # Safety switch: scheduled runs do nothing until the repo variable FINSHORTS_ENABLED is set to 'true'
    # (Settings -> Secrets and variables -> Actions -> Variables). Manual runs default to dry_run=true.
    if: github.event_name == 'workflow_dispatch' || vars.FINSHORTS_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45     # approval wait (25 min) + ~3 min build
    env:
      CHANNEL_NAME: ${{ vars.CHANNEL_NAME }}
      CHANNEL_HANDLE: ${{ vars.CHANNEL_HANDLE }}
      COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TELEGRAM_COMMUNITY_CHAT_ID: ${{ vars.TELEGRAM_COMMUNITY_CHAT_ID }}
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_PUBLIC_BASE: ${{ secrets.R2_PUBLIC_BASE }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      HF_HUB_DISABLE_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip}
      - name: system packages
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg espeak-ng
      - name: model cache (Kokoro weights, whisper)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.rembg
          key: hf-kokoro-rembg-v2
      - name: install
        run: |
          pip install --extra-index-url https://download.pytorch.org/whl/cpu torch==2.6.0+cpu
          pip install -r requirements.txt
      - name: run
        run: |
          if [ -n "${{ github.event.inputs.format }}" ]; then ARGS="--format ${{ github.event.inputs.format }}"; else ARGS="--auto"; fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          python run.py $ARGS
      - name: persist dedupe log
        if: always()
        run: |
          git config user.name "finshorts-bot"; git config user.email "finshorts-bot@users.noreply.github.com"
          git add state/ assets/people/ || true   # per-person portrait cache incl. license meta.json
          git diff --cached --quiet || (git commit -m "state: upload log [skip ci]" && git pull --rebase && git push)
      - name: keep video as artifact (3 days)
        if: always()
        uses: actions/upload-artifact@v4
        with: {name: out, path: "out/**/*.mp4", retention-days: 3, if-no-files-found: ignore}
