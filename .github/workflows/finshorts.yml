name: finshorts
# One cron per slot (UTC) plus catch-up crons every 15 min in the evening. GitHub starts scheduled jobs 30-60 min
# late or drops them; scripts/slot_due.py posts any missed active slot up to 180 min late (config schedule.catch_up),
# one per run, min. 30 min after the last upload, and only the slots active in the current launch phase (config/config.yaml schedule.phases):
#   from 2026-10-28: s01-s03 only (17:30 / 19:00 / 22:15 Europe/Zurich) = 3 premium 4K60 videos/day.
#   The former ramp to 10/day on 2026-11-11 is disabled; s04-s10 stay defined (crons below) but inactive.
# Inactive slots exit in the cheap "slot due?" step (~20 s) before any heavy install.
# Times in comments = Europe/Zurich winter time (UTC+1); in summer time (from 2027-03-28) they are +1 h later locally.
on:
  schedule:
    - cron: "0 18 * * *"      # s01 crypto_update  (19:00 Zurich winter)
    - cron: "15 21 * * *"     # s02 close_recap  (22:15 Zurich winter)
    - cron: "30 16 * * *"     # s03 chart_of_the_day  (17:30 Zurich winter)
    - cron: "45 14 * * *"     # s04 us_open  (15:45 Zurich winter)
    - cron: "30 19 * * *"     # s05 quiz  (20:30 Zurich winter)
    - cron: "0 12 * * *"      # s06 pre_market  (13:00 Zurich winter)
    - cron: "0 11 * * *"      # s07 macro_calendar  (12:00 Zurich winter)
    - cron: "30 20 * * *"     # s08 explainer  (21:30 Zurich winter)
    - cron: "0 13 * * *"      # s09 midday_movers  (14:00 Zurich winter)
    - cron: "0 7 * * *"       # s10 crypto_morning  (08:00 Zurich winter)
    - cron: "7,22,37,52 16-23 * * *"   # catch-up for late/dropped evening slot runs (cheap gate exits if nothing pending)
    - cron: "7,22,37 0 * * *"          # catch-up for s02 (21:15 UTC) past midnight
  workflow_dispatch:
    inputs:
      format: {description: "format (empty = --auto)", required: false, default: ""}
      dry_run: {description: "dry run (no upload)", type: boolean, default: true}

permissions:
  contents: write          # commit state/upload_log.json + GitHub Release hosting (Instagram url mode)

concurrency: {group: finshorts, cancel-in-progress: false}

jobs:
  make:
    # Safety switch: scheduled runs do nothing until the repo variable FINSHORTS_ENABLED is set to 'true'
    # (Settings -> Secrets and variables -> Actions -> Variables). Manual runs default to dry_run=true.
    if: github.event_name == 'workflow_dispatch' || vars.FINSHORTS_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 75     # approval wait (25 min, only if Telegram is configured) + ~10 min 4K60 build/upload + headroom
    env:
      CHANNEL_NAME: ${{ vars.CHANNEL_NAME }}
      CHANNEL_HANDLE: ${{ vars.CHANNEL_HANDLE }}
      COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TELEGRAM_COMMUNITY_CHAT_ID: ${{ vars.TELEGRAM_COMMUNITY_CHAT_ID }}
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_PUBLIC_BASE: ${{ secrets.R2_PUBLIC_BASE }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      HF_HUB_DISABLE_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4
      - name: latest state
        # a queued run may have been checked out before the previous run committed state/upload_log.json
        run: git pull --ff-only || true
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip}
      - name: slot due?
        id: gate
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then echo "due=true" >> "$GITHUB_OUTPUT"; echo "manual run"; exit 0; fi
          pip install -q "PyYAML>=6.0"
          python scripts/slot_due.py
      - name: system packages
        if: steps.gate.outputs.due == 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg espeak-ng
      - name: model cache (Kokoro weights, faster-whisper, rembg u2netp)
        if: steps.gate.outputs.due == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.u2net
          key: models-kokoro-whisper-u2net-v3
          restore-keys: |
            hf-kokoro-rembg-v2
      - name: install
        if: steps.gate.outputs.due == 'true'
        run: |
          pip install --extra-index-url https://download.pytorch.org/whl/cpu torch==2.6.0+cpu
          pip install -r requirements.txt
      - name: run
        id: run
        if: steps.gate.outputs.due == 'true'
        timeout-minutes: 50   # 4K60 render ~4-6 min on 4 vCPU (measured), upload of ~60-90 MB; generous headroom
        env:
          IN_FORMAT: ${{ github.event.inputs.format }}
          IN_DRY: ${{ github.event.inputs.dry_run }}
          GATE_SLOT: ${{ steps.gate.outputs.slot }}
          GATE_DATE: ${{ steps.gate.outputs.slot_date }}
        run: |
          # scheduled: use the slot + slot date the gate found (install takes ~2 min; date matters for catch-up after midnight)
          if [ -n "$IN_FORMAT" ]; then ARGS="--format $IN_FORMAT"; elif [ -n "$GATE_SLOT" ]; then ARGS="--slot $GATE_SLOT --slot-date $GATE_DATE"; else ARGS="--auto"; fi
          if [ "$IN_DRY" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          echo "python run.py $ARGS"
          python run.py $ARGS
          for f in out/*/run_log.json; do
            [ -f "$f" ] || continue
            python - "$f" <<'PY'
          import json, sys
          l = json.load(open(sys.argv[1]))
          print(f"::notice title=finshorts-{l['job_id']}::LLM={l.get('script_provider')} video={l.get('probed_duration')}s "
                f"tts={l.get('tts_seconds')}s render={l.get('render_seconds')}s ({l.get('renderer')}, {l.get('render_timing', {})}) total={l.get('total_seconds')}s "
                f"youtube={l.get('youtube', 'dry-run')}")
          PY
          done
          for v in out/*/*.mp4; do
            [ -f "$v" ] || continue
            echo "::notice title=video-spec::$(basename "$v") $(stat -c %s "$v") bytes | $(ffprobe -v error -select_streams v:0 -show_entries stream=width,height,r_frame_rate,profile,pix_fmt,color_primaries,bit_rate -of compact=p=0:nk=0 "$v")"
          done
      - name: persist dedupe log
        # state/upload_log.json (uploads + used stories) is committed back so the same story / slot is never posted twice
        if: always() && steps.gate.outputs.due == 'true'
        run: |
          git config user.name "finshorts-bot"; git config user.email "finshorts-bot@users.noreply.github.com"
          git add state/ assets/people/ || true   # per-person portrait cache incl. license meta.json
          if ! git diff --cached --quiet; then
            git commit -m "state: upload log [skip ci]"
            for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
          fi
      - name: keep video as artifact (3 days)
        if: always() && steps.gate.outputs.due == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: finshorts-video-${{ github.run_id }}
          path: |
            out/**/*.mp4
            out/**/run_log.json
            out/**/script.txt
            out/**/metadata.json
          retention-days: 3
          if-no-files-found: ignore
